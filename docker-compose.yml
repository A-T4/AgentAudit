services:
  agentaudit-sentinel:
    build: .
    container_name: agentaudit-core
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      # HMAC signing key for audit trail. OVERRIDE IN PRODUCTION via .env file.
      - AGENTAUDIT_HMAC_KEY=${AGENTAUDIT_HMAC_KEY:-dev-signing-key-change-in-production}
      # API key for /audit endpoint. If unset, auth is disabled (dev mode).
      - AGENTAUDIT_API_KEY=${AGENTAUDIT_API_KEY:-}
      # Audit log path (inside container)
      - AGENTAUDIT_LOG_PATH=/app/logs/audit_trail.jsonl
      # Rate limiter config — per session_id sliding window
      - AGENTAUDIT_RATE_LIMIT=${AGENTAUDIT_RATE_LIMIT:-60}
      - AGENTAUDIT_RATE_WINDOW_SECONDS=${AGENTAUDIT_RATE_WINDOW_SECONDS:-60}
    volumes:
      # Persist audit trail outside container — survives rebuilds
      - ./logs:/app/logs
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
